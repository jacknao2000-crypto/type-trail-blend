<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Trail Blend — Interactive Showcase v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0d0e12;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:#ccc;overflow-x:hidden}
header{width:100%;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;background:rgba(20,22,28,0.95);border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;z-index:100}
.brand h1{font-size:16px;font-weight:700;letter-spacing:0.06em;color:#fff}
.brand p{font-size:12px;color:#888;margin-top:2px}
.nav-tabs{display:flex;gap:8px}
.tab-btn{background:#1e2029;color:#aaa;border:1px solid rgba(255,255,255,0.1);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s ease}
.tab-btn:hover{background:#2a2d3d;color:#fff}
.tab-btn.active{background:#00d2ff;color:#000;border-color:transparent}
.stage{margin:24px 0 16px 0;box-shadow:0 20px 60px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;background:#000}
.viewport{width:540px;height:720px;overflow:hidden;position:relative}
iframe{width:1080px;height:1440px;border:none;transform:scale(0.5);transform-origin:0 0}
.controls{display:flex;gap:12px;align-items:center;background:#181a22;padding:10px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);margin-bottom:24px}
button.ctrl-btn{background:#252836;color:#fff;border:1px solid rgba(255,255,255,0.12);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
button.ctrl-btn:hover{background:#32364a}
input[type=range]{width:260px;accent-color:#00d2ff;cursor:pointer}
.clock{font-size:12px;font-variant-numeric:tabular-nums;color:#aaa;min-width:80px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>TYPE TRAIL BLEND // SHOWCASE v2.0</h1>
    <p>Dynamic Vector Morphing Engine: English, Chinese & Graphical Dual-Level Blend</p>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn" data-src="index.html" data-comp="type-trail-design" data-dur="6.0">DESIGN (v1.1)</button>
    <button class="tab-btn" data-src="examples/fengshui/index.html" data-comp="type-trail-fengshui" data-dur="5.0">风水 · FENG SHUI</button>
    <button class="tab-btn active" data-src="examples/shangshanruoshui/index.html" data-comp="type-trail-shangshanruoshui" data-dur="7.0">上善若水 · DUAL BLEND</button>
  </div>
</header>

<div class="stage">
  <div class="viewport">
    <iframe id="comp-frame" src="examples/shangshanruoshui/index.html"></iframe>
  </div>
</div>

<div class="controls">
  <button id="btn-play" class="ctrl-btn">▶ Play</button>
  <button id="btn-restart" class="ctrl-btn">↺ Restart</button>
  <input id="scrubber" type="range" min="0" max="1" step="0.001" value="0">
  <span id="clock" class="clock">0.00 / 7.0s</span>
</div>

<script>
const frame = document.getElementById('comp-frame');
const playBtn = document.getElementById('btn-play');
const restartBtn = document.getElementById('btn-restart');
const scrubber = document.getElementById('scrubber');
const clock = document.getElementById('clock');
const tabs = document.querySelectorAll('.tab-btn');

let currentCompId = 'type-trail-shangshanruoshui';
let currentDur = 7.0;
let tl = null;
let isPlaying = false;
let raf = null;

function bindTimeline() {
  tl = null;
  const w = frame.contentWindow;
  const timer = setInterval(() => {
    if (w.__timelines && w.__timelines[currentCompId]) {
      tl = w.__timelines[currentCompId];
      clearInterval(timer);
      tl.progress(0);
      updateClock();
    }
  }, 40);
}

frame.addEventListener('load', bindTimeline);

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCompId = tab.getAttribute('data-comp');
    currentDur = parseFloat(tab.getAttribute('data-dur'));
    pause();
    frame.src = tab.getAttribute('data-src');
  });
});

function play() {
  if (!tl) return;
  if (tl.progress() >= 1) tl.progress(0);
  isPlaying = true;
  playBtn.textContent = '⏸ Pause';
  const startT = performance.now() - tl.time() * 1000;
  function loop(now) {
    if (!isPlaying) return;
    const elapsed = (now - startT) / 1000;
    if (elapsed >= currentDur) {
      tl.progress(1);
      pause();
      updateClock();
      return;
    }
    tl.time(elapsed);
    updateClock();
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
}

function pause() {
  isPlaying = false;
  playBtn.textContent = '▶ Play';
  if (raf) cancelAnimationFrame(raf);
}

playBtn.addEventListener('click', () => {
  if (isPlaying) pause();
  else play();
});

restartBtn.addEventListener('click', () => {
  if (!tl) return;
  tl.progress(0);
  play();
});

scrubber.addEventListener('input', () => {
  if (!tl) return;
  pause();
  tl.progress(parseFloat(scrubber.value));
  updateClock();
});

function updateClock() {
  if (!tl) return;
  scrubber.value = tl.progress();
  clock.textContent = tl.time().toFixed(2) + ' / ' + currentDur.toFixed(1) + 's';
}
</script>
</body>
</html>
