<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — Type Trail: 上善若水 (Shang Shan Ruo Shui)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0e12;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(20, 22, 28, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .title-group h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: 0;
    }
    .title-group p {
      font-size: 12px;
      color: #888;
      margin: 2px 0 0 0;
    }
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      background: #252836;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    button:hover {
      background: #32364a;
      border-color: rgba(255, 255, 255, 0.25);
    }
    button.primary {
      background: #00d2ff;
      color: #000;
      border: none;
    }
    button.primary:hover {
      background: #33dcff;
    }
    .scrubber-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: #aaa;
    }
    input[type=range] {
      width: 200px;
      accent-color: #00d2ff;
      cursor: pointer;
    }
    .stage-wrapper {
      margin: 24px 0;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      transform-origin: top center;
    }
    iframe {
      width: 1080px;
      height: 1440px;
      border: none;
      display: block;
      transform: scale(0.52);
      transform-origin: top center;
    }
    .viewport-box {
      width: 561.6px;
      height: 748.8px;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>TYPE TRAIL // 上善若水 (SHANG SHAN RUO SHUI)</h1>
      <p>Dual-Level Graphic Morphing: 10 Inner Steps + 3-Stage Serpentine Dynamics</p>
    </div>
    <div class="controls">
      <button id="btn-play" class="primary">Play / Pause</button>
      <button id="btn-restart">Restart</button>
      <div class="scrubber-container">
        <span id="time-display">0.00s</span>
        <input type="range" id="scrubber" min="0" max="7.0" step="0.01" value="0">
        <span>7.0s</span>
      </div>
    </div>
  </header>

  <div class="stage-wrapper">
    <div class="viewport-box">
      <iframe id="anim-frame" src="index.html"></iframe>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('anim-frame');
    const btnPlay = document.getElementById('btn-play');
    const btnRestart = document.getElementById('btn-restart');
    const scrubber = document.getElementById('scrubber');
    const timeDisplay = document.getElementById('time-display');

    let tl = null;

    iframe.addEventListener('load', () => {
      const iWindow = iframe.contentWindow;
      tl = iWindow.tl;
      if (tl) {
        tl.play();
        requestAnimationFrame(updateLoop);
      }
    });

    function updateLoop() {
      if (tl) {
        const time = tl.time();
        scrubber.value = time;
        timeDisplay.textContent = time.toFixed(2) + 's';
      }
      requestAnimationFrame(updateLoop);
    }

    btnPlay.addEventListener('click', () => {
      if (!tl) return;
      if (tl.paused()) {
        tl.play();
        btnPlay.textContent = 'Pause';
      } else {
        tl.pause();
        btnPlay.textContent = 'Play';
      }
    });

    btnRestart.addEventListener('click', () => {
      if (!tl) return;
      tl.restart();
      btnPlay.textContent = 'Pause';
    });

    scrubber.addEventListener('input', (e) => {
      if (!tl) return;
      tl.pause();
      tl.time(parseFloat(e.target.value));
      btnPlay.textContent = 'Play';
    });
  </script>
</body>
</html>
